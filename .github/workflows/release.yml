name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 preview APK
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Rename APK artifact
        run: |
          APK=$(find app/build/outputs/apk/preview -name "*.apk" | head -n 1)
          mkdir -p dist
          cp "$APK" dist/Porcelain-MPV-arm64.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Porcelain-MPV-arm64
          path: dist/Porcelain-MPV-arm64.apk

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/Porcelain-MPV-arm64.apk
