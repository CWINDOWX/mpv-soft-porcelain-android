name: Build

on:
  pull_request:
  push:
    branches:
      - main
      - feat/soft-porcelain-android

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate short SHA
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build arm64 preview APK
        run: ./gradlew :app:assemblePreview --no-daemon --stacktrace

      - name: Upload arm64 Preview APK
        uses: actions/upload-artifact@v4
        with:
          name: Porcelain-MPV-arm64-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/preview/*.apk
